<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MensInBlack La Paz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#1c0f4a; --purple:#3a1e8c; --violet:#7c4dff;
    --gold:#f4b93f; --gold-deep:#d69420;
    --water:#33b8e6; --water-deep:#0f7fb0;
    --paper:#faf5ea; --danger:#e14b4b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--purple-deep);font-family:'IBM Plex Mono',monospace;color:var(--paper);}
  .stage{position:relative;width:100%;min-height:100%;
    background:radial-gradient(circle at 12% 8%, rgba(124,77,255,0.35), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(244,185,63,0.12), transparent 45%), var(--purple-deep);
    display:flex;flex-direction:column;align-items:center;padding:22px 14px 40px;overflow-x:hidden;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand .dot{width:10px;height:10px;background:var(--gold);border-radius:2px;transform:rotate(45deg);}
  .brand-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;}
  .brand-text span{color:var(--gold);}
  .brand-sub{font-size:10px;letter-spacing:3px;color:#b9a6f5;text-transform:uppercase;margin-top:-4px;}
  .panel{width:100%;max-width:560px;background:linear-gradient(180deg,#241259,#160a3d);
    border:1px solid #4b2fa0;border-radius:18px;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.45);}
  .agent-row{display:flex;gap:16px;align-items:center;margin-bottom:20px;}
  .avatar{width:74px;height:74px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #6d4dcf, #2a1666);
    border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:var(--gold);}
  .agent-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .agent-meta{font-size:11px;color:#c6b8f0;margin-top:3px;line-height:1.5;}
  .quote{font-family:'Space Grotesk',sans-serif;font-style:italic;font-size:14px;line-height:1.5;
    background:rgba(124,77,255,0.12);border-left:3px solid var(--gold);padding:12px 14px;border-radius:6px;
    color:#ecdfff;margin-bottom:18px;}
  .mission{font-size:12.5px;line-height:1.7;color:#d8cdf5;margin-bottom:22px;}
  .mission b{color:var(--gold);}
  .btn{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.5px;
    background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#221000;
    border:none;border-radius:10px;padding:13px 20px;cursor:pointer;width:100%;
    box-shadow:0 6px 0 #9c6c0f, 0 10px 18px rgba(0,0,0,0.35);}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c6c0f;}
  .btn.secondary{background:linear-gradient(180deg,#4a2fb0,#2c1878);color:#fff;
    box-shadow:0 6px 0 #1c0f52, 0 10px 18px rgba(0,0,0,0.35);}
  .level-grid{display:flex;gap:10px;margin-bottom:20px;}
  .level-pill{flex:1;background:rgba(124,77,255,0.15);border:1px solid #4b2fa0;border-radius:10px;
    padding:10px 6px;text-align:center;font-size:11px;color:#c6b8f0;}
  .level-pill.locked{opacity:0.4;}
  .level-pill .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--gold);}
  .pill-meta{font-size:9px;color:#8a78c0;margin-top:5px;letter-spacing:0.3px;}
  .hud{width:100%;max-width:860px;display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .stat{background:rgba(20,10,50,0.75);border:1px solid #4b2fa0;border-radius:10px;
    padding:8px 14px;text-align:center;min-width:88px;}
  .stat .label{font-size:9px;letter-spacing:1.5px;color:#b9a6f5;text-transform:uppercase;}
  .stat .value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--gold);}
  .stat.time .value{color:var(--water);}
  .stat.danger .value{color:var(--danger);}
  .game-wrap{position:relative;width:100%;max-width:860px;border-radius:16px;overflow:hidden;
    border:2px solid #4b2fa0;box-shadow:0 20px 50px rgba(0,0,0,0.5);cursor:crosshair;}
  canvas{display:block;width:100%;height:auto;position:absolute;top:0;left:0;}
  .tag{position:absolute;top:8px;left:8px;background:rgba(20,10,50,0.7);z-index:5;
    font-size:10px;padding:4px 8px;border-radius:6px;color:var(--gold);letter-spacing:1px;}
  .hint{max-width:860px;width:100%;font-size:11px;color:#b9a6f5;margin-top:10px;text-align:center;line-height:1.6;}
  .hint b{color:var(--gold);}
  .end-panel{width:100%;max-width:520px;background:linear-gradient(180deg,#241259,#160a3d);
    border:1px solid #4b2fa0;border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.45);
    position:relative;overflow:hidden;}
  .confetti{position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;opacity:0.95;
    animation-name:fall;animation-timing-function:ease-in;animation-fill-mode:forwards;}
  @keyframes fall{ to{ transform:translateY(420px) rotate(420deg); opacity:0; } }
  @keyframes popIn{ 0%{transform:scale(0.4) rotate(-8deg);opacity:0;} 70%{transform:scale(1.08) rotate(2deg);opacity:1;} 100%{transform:scale(1) rotate(0);} }
  .badge{animation:popIn 0.5s cubic-bezier(.34,1.56,.64,1);}
  .badge{width:120px;height:120px;border-radius:50%;margin:14px auto 18px;
    background:radial-gradient(circle at 35% 30%,#ffe08a,var(--gold-deep));
    border:5px solid var(--violet);display:flex;align-items:center;justify-content:center;
    font-size:44px;box-shadow:0 10px 30px rgba(244,185,63,0.4);}
  .badge.fail{background:radial-gradient(circle at 35% 30%,#f29a9a,#a83030);border-color:#5a1c1c;}
  .victory-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--gold);}
  .fail .victory-title{color:var(--danger);}
  .score-row{display:flex;justify-content:space-between;background:rgba(124,77,255,0.15);
    border-radius:10px;padding:12px 16px;margin:18px 0 8px;font-size:13px;}
  .score-row b{color:#fff;font-family:'Space Grotesk',sans-serif;}
  .eco-line{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--water);font-size:15px;margin:10px 0 20px;}
  .meter-bar{width:100%;height:10px;background:#160a3d;border-radius:6px;overflow:hidden;margin:14px 0;border:1px solid #4b2fa0;}
  .meter-fill{height:100%;background:linear-gradient(90deg,var(--water-deep),var(--water));}
  .footer-credit{margin-top:26px;font-size:9.5px;color:#8a78c0;letter-spacing:1px;text-align:center;}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const stage = document.getElementById('stage');

const LEVELS = [
  { name:'Barrio Sur', drops:24, time:75, valves:2, winPct:0.55,
    gateXs:[0.30,0.65], bonus:[{chamber:1,x:0.55}],
    brief:'La primera compuerta ya est\u00e1 abierta. Abre la segunda y desv\u00eda un chorro hacia la gota dorada.' },
  { name:'Zona Central', drops:30, time:85, valves:3, winPct:0.58,
    gateXs:[0.72,0.25,0.60], bonus:[{chamber:1,x:0.20},{chamber:2,x:0.75}],
    brief:'Tres compuertas en zigzag. Cava de un lado a otro antes de que el agua se estanque.' },
  { name:'Ladera Alta', drops:36, time:95, valves:4, winPct:0.62,
    gateXs:[0.20,0.75,0.30,0.65], bonus:[{chamber:1,x:0.60},{chamber:3,x:0.25}],
    brief:'Cuatro compuertas y rocas sueltas. Coordina tiempo y excavaci\u00f3n para no perder ni una gota.' },
];
let unlocked = 1;
let currentLevel = 0;

const GAME = { cols:150, rows:88, cell:5.6 };
const TILE = { AIR:0, DIRT:1, WALL:2, TUB:3, DRAIN:4 };

let grid, bgCanvas, bgCtx, waterCanvas, waterCtx, loopRunning=false, lastFrame=0;
let waterCells=[], spawned=0, collected=0, lost=0, timeLeft=0, animT=0;
let splashParticles=[];
let spawnTimer=null, tickTimer=null, dragging=false;
let valves=[], tubRect, sourcePoint, dirtNoise=null, cfg=null;
let bonusPoints=[], bonusCollected=0;

function renderStart(){
  stage.innerHTML = `
    <div class="brand"><div class="dot"></div><div>
      <div class="brand-text">MensIn<span>Black</span></div>
      <div class="brand-sub">La Paz &middot; Unidad Eco-Agentes</div></div></div>
    <div class="panel">
      <div class="agent-row">
        <div class="avatar">R</div>
        <div><div class="agent-name">Agente Rodmy</div>
          <div class="agent-meta">21 a&ntilde;os &middot; Estudiante universitario &middot; La Paz<br/>Audif&oacute;nos puestos, celular en mano.</div></div>
      </div>
      <div class="quote">"A m&iacute; no me des discursos sobre el planeta; dime qu&eacute; puedo hacer f&aacute;cil en mi d&iacute;a a d&iacute;a y que de verdad valga la pena."</div>
      <div class="mission"><b>MISI&Oacute;N:</b> Rodmy quiere ba&ntilde;arse. Cava con el cursor y activa las v&aacute;lvulas ON/OFF
      para guiar el agua desde la tuber&iacute;a hasta su tina, antes de que se pierda o se acabe el tiempo.</div>
      <div class="level-grid">
        ${LEVELS.map((l,i)=>`
          <div class="level-pill ${i<unlocked?'':'locked'}" ${i<unlocked?`onclick="launchLevel(${i})" style="cursor:pointer;"`:''}>
            <div class="num">${i<unlocked?(i+1):'🔒'}</div>${l.name}
            <div class="pill-meta">💧${l.drops} · 🚰${l.valves} · ⏱${l.time}s</div>
          </div>`).join('')}
      </div>
      <button class="btn" onclick="launchLevel(${unlocked-1})">▶ ${unlocked>1?'CONTINUAR':'INICIAR MISI\u00d3N'}</button>
    </div>
    <div class="hint">${LEVELS.length} niveles &middot; <b>Puzzle de F&iacute;sica</b></div>`;
}

function launchLevel(i){ currentLevel=i; startLevel(); }

function buildLevel(){
  cfg = LEVELS[currentLevel];
  const {cols,rows}=GAME;
  grid = new Uint8Array(cols*rows);
  const idx=(x,y)=>y*cols+x;
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++)
    grid[idx(x,y)] = (y < rows*0.15) ? TILE.AIR : TILE.DIRT;

  sourcePoint = {x:Math.floor(cols*0.09), y:Math.floor(rows*0.16)};
  for(let y=0;y<sourcePoint.y+4;y++) for(let x=sourcePoint.x-5;x<sourcePoint.x+6;x++)
    if(x>=0&&x<cols) grid[idx(x,y)] = TILE.AIR;
  // pequeño hueco bajo el tubo para que la gota no nazca pegada a la tierra
  for(let y=sourcePoint.y+2;y<sourcePoint.y+7;y++)
    for(let x=sourcePoint.x-3;x<sourcePoint.x+4;x++)
      if(x>=0&&x<cols) grid[idx(x,y)] = TILE.AIR;

  const tw=22, th=17, tx=cols-tw-6, ty=rows-th-3;
  tubRect = {x:tx,y:ty,w:tw,h:th};
  for(let y=ty;y<ty+th;y++) for(let x=tx;x<tx+tw;x++) grid[idx(x,y)] = TILE.TUB;
  for(let y=ty-4;y<ty;y++) for(let x=tx+5;x<tx+tw-5;x++) grid[idx(x,y)] = TILE.AIR;

  for(let x=0;x<10;x++) grid[idx(x, rows-1)] = TILE.DRAIN;
  for(let x=Math.floor(cols*0.46);x<Math.floor(cols*0.46)+10;x++) grid[idx(x, rows-1)] = TILE.DRAIN;

  // --- cámaras separadas por compuertas de ancho completo (el diseño real del nivel) ---
  const y0 = sourcePoint.y+8, yEnd = ty-3;
  const n = cfg.valves;
  const chamberY = [y0];
  for(let k=1;k<=n;k++) chamberY.push(Math.round(y0 + (k*(yEnd-y0))/(n+1)));
  chamberY.push(yEnd);

  valves=[];
  for(let k=0;k<n;k++){
    const gy = chamberY[k+1];
    const gx = Math.floor(cols*cfg.gateXs[k]);
    valves.push({x:gx, y:gy, bandTop:gy-1, bandBot:gy+1, open:k===0});
  }
  valves.forEach(v=>{
    for(let y=v.bandTop;y<=v.bandBot;y++) for(let x=0;x<cols;x++) grid[idx(x,y)]=v.open?TILE.AIR:TILE.WALL;
  });

  // rocas sueltas dentro de cada cámara: obstáculos menores, no excavables
  for(let k=0;k<chamberY.length-1;k++){
    const top=chamberY[k]+2, bot=chamberY[k+1]-2;
    if(bot<=top) continue;
    const rockCount = 1+currentLevel;
    for(let r=0;r<rockCount;r++){
      const rx = 12+Math.floor(Math.random()*(cols-24));
      const ry = top+Math.floor(Math.random()*(bot-top));
      const rr = 1+Math.floor(Math.random()*2);
      for(let y=ry-rr;y<=ry+rr;y++) for(let x=rx-rr;x<=rx+rr;x++)
        if(x>=0&&x<cols&&y>=0&&y<rows&&grid[idx(x,y)]===TILE.DIRT) grid[idx(x,y)]=TILE.WALL;
    }
  }

  // bolsillos bonus: cámaras de aire aisladas, el jugador debe cavar de lado para llegar
  bonusPoints = (cfg.bonus||[]).map(b=>{
    const top=chamberY[b.chamber], bot=chamberY[b.chamber+1];
    const by = Math.floor((top+bot)/2);
    const bx = Math.floor(cols*b.x);
    for(let y=by-3;y<=by+3;y++) for(let x=bx-3;x<=bx+3;x++)
      if(x>=0&&x<cols&&y>=0&&y<rows&&(x-bx)**2+(y-by)**2<=9) grid[idx(x,y)]=TILE.AIR;
    return {x:bx,y:by,collected:false};
  });

  waterCells=[]; spawned=0; collected=0; lost=0; bonusCollected=0; timeLeft=cfg.time; splashParticles=[]; animT=0;

  const nc = document.createElement('canvas');
  nc.width=cols; nc.height=rows;
  const nctx = nc.getContext('2d');
  const img = nctx.createImageData(cols,rows);
  for(let i=0;i<cols*rows;i++){
    const v = 200+Math.floor(Math.random()*40)-20;
    img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255;
  }
  nctx.putImageData(img,0,0);
  dirtNoise = nc;
}

function startLevel(){
  buildLevel();
  stage.innerHTML = `
    <div class="brand"><div class="dot"></div><div>
      <div class="brand-text">MensIn<span>Black</span></div>
      <div class="brand-sub">Nivel ${currentLevel+1} &middot; ${cfg.name}</div></div></div>
    <div class="hud">
      <div class="stat time"><div class="label">Tiempo</div><div class="value" id="hud-time">${timeLeft}s</div></div>
      <div class="stat"><div class="label">Tina</div><div class="value" id="hud-pct">0%</div></div>
      <div class="stat danger"><div class="label">Perdido</div><div class="value" id="hud-lost">0</div></div>
      <div class="stat"><div class="label">Meta</div><div class="value">${Math.round(cfg.winPct*100)}%</div></div>
      <div class="stat"><div class="label">Bonus</div><div class="value" id="hud-bonus">0/${(cfg.bonus||[]).length}</div></div>
    </div>
    <div class="game-wrap" id="gamewrap" style="aspect-ratio:${GAME.cols}/${GAME.rows};">
      <div class="tag">NIVEL ${currentLevel+1} &middot; ${cfg.name}</div>
      <canvas id="bg" width="${GAME.cols*GAME.cell}" height="${GAME.rows*GAME.cell}"></canvas>
      <canvas id="water" width="${GAME.cols*GAME.cell}" height="${GAME.rows*GAME.cell}" style="filter:blur(7px) contrast(28);"></canvas>
    </div>
    <div class="hint">${cfg.brief}<br/>Arrastra sobre la <b>tierra</b> para cavar. Haz clic en las <b>compuertas</b> para abrir/cerrar. Las rocas grises no se excavan.</div>`;

  bgCanvas=document.getElementById('bg'); bgCtx=bgCanvas.getContext('2d');
  waterCanvas=document.getElementById('water'); waterCtx=waterCanvas.getContext('2d');

  setupInput();
  drawTerrain();
  loopRunning=true; lastFrame=performance.now();
  requestAnimationFrame(gameLoop);

  spawnTimer=setInterval(()=>{
    if(spawned<cfg.drops){
      waterCells.push({x:sourcePoint.x+(Math.random()*3-1.5), y:sourcePoint.y+2});
      spawned++;
    } else clearInterval(spawnTimer);
  }, Math.max(480, 650-currentLevel*40));

  tickTimer=setInterval(()=>{
    timeLeft--;
    const t=document.getElementById('hud-time'); if(t) t.textContent=timeLeft+'s';
    if(timeLeft<=0){ clearInterval(tickTimer); clearInterval(spawnTimer); endLevel(); }
  },1000);
}

function setupInput(){
  const wrap=document.getElementById('gamewrap');
  function getCell(e){
    const rect=bgCanvas.getBoundingClientRect();
    const scaleX=bgCanvas.width/rect.width, scaleY=bgCanvas.height/rect.height;
    const clientX=e.clientX ?? e.touches?.[0].clientX, clientY=e.clientY ?? e.touches?.[0].clientY;
    const cx=(clientX-rect.left)*scaleX, cy=(clientY-rect.top)*scaleY;
    return {x:Math.floor(cx/GAME.cell), y:Math.floor(cy/GAME.cell)};
  }
  function dig(gx,gy,r){
    let changed=false;
    for(let y=gy-r;y<=gy+r;y++) for(let x=gx-r;x<=gx+r;x++){
      if(x<0||x>=GAME.cols||y<0||y>=GAME.rows) continue;
      const i=y*GAME.cols+x;
      if(grid[i]===TILE.DIRT && (x-gx)**2+(y-gy)**2<=r*r){ grid[i]=TILE.AIR; changed=true; }
    }
    if(changed) drawTerrain();
  }
  function tryToggleValve(gx,gy){
    for(const v of valves){
      if(Math.hypot(v.x-gx,v.y-gy)<=9){
        v.open=!v.open;
        for(let y=v.bandTop;y<=v.bandBot;y++) for(let x=0;x<GAME.cols;x++){
          const i=y*GAME.cols+x;
          if(v.open){ if(grid[i]===TILE.WALL) grid[i]=TILE.AIR; }
          else { if(grid[i]===TILE.AIR) grid[i]=TILE.WALL; }
        }
        for(let i=0;i<6;i++) splashParticles.push({x:v.x+(Math.random()-0.5)*5, y:v.y+(Math.random()-0.5)*2, vx:(Math.random()-0.5)*1.4, vy:-Math.random()*1.4-0.3, life:1, color:v.open?'#7dfab0':'#ff9d9d'});
        drawTerrain();
        return true;
      }
    }
    return false;
  }
  function down(e){ e.preventDefault(); const {x,y}=getCell(e); if(tryToggleValve(x,y)) return; dragging=true; dig(x,y,4); }
  function move(e){ if(!dragging) return; e.preventDefault(); const {x,y}=getCell(e); dig(x,y,4); }
  function up(){ dragging=false; }
  wrap.addEventListener('mousedown',down);
  wrap.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  wrap.addEventListener('touchstart',down,{passive:false});
  wrap.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',up);
}

function drawTerrain(){
  const {cols,rows,cell}=GAME;
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  const skyH=rows*0.15*cell;
  const skyGrad=bgCtx.createLinearGradient(0,0,0,skyH);
  skyGrad.addColorStop(0,'#bfe9f7'); skyGrad.addColorStop(1,'#e3f5fb');
  bgCtx.fillStyle=skyGrad; bgCtx.fillRect(0,0,bgCanvas.width,skyH);

  bgCtx.save();
  bgCtx.beginPath();
  for(let y=0;y<rows;y++){
    let runStart=-1;
    for(let x=0;x<=cols;x++){
      const isDirt = x<cols && grid[y*cols+x]===TILE.DIRT;
      if(isDirt && runStart===-1) runStart=x;
      if((!isDirt || x===cols) && runStart!==-1){
        bgCtx.rect(runStart*cell, y*cell, (x-runStart)*cell, cell+0.6);
        runStart=-1;
      }
    }
  }
  bgCtx.clip();
  const dg=bgCtx.createLinearGradient(0,skyH,0,bgCanvas.height);
  dg.addColorStop(0,'#a8703f'); dg.addColorStop(0.4,'#8a5a34'); dg.addColorStop(1,'#4a2c14');
  bgCtx.fillStyle=dg; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  if(dirtNoise){
    bgCtx.globalAlpha=0.18; bgCtx.globalCompositeOperation='overlay';
    bgCtx.drawImage(dirtNoise,0,0,cols,rows,0,0,bgCanvas.width,bgCanvas.height);
    bgCtx.globalCompositeOperation='source-over'; bgCtx.globalAlpha=1;
  }
  bgCtx.restore();

  const surfaceRow=Math.floor(rows*0.15);
  bgCtx.strokeStyle='#3f8f52'; bgCtx.lineWidth=2; bgCtx.lineCap='round';
  for(let x=3;x<cols-3;x+=3){
    if(grid[surfaceRow*cols+x]===TILE.DIRT){
      const gx=x*cell+cell/2, gy=surfaceRow*cell;
      bgCtx.beginPath();
      bgCtx.moveTo(gx-3,gy); bgCtx.lineTo(gx-1,gy-7);
      bgCtx.moveTo(gx,gy); bgCtx.lineTo(gx,gy-9);
      bgCtx.moveTo(gx+3,gy); bgCtx.lineTo(gx+1,gy-7);
      bgCtx.stroke();
    }
  }

  bgCtx.fillStyle='#7d8aa3';
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++)
    if(grid[y*cols+x]===TILE.WALL) bgCtx.fillRect(x*cell,y*cell,cell,cell);

  drawTub();

  valves.forEach(v=>{
    if(!v.open){
      bgCtx.save();
      const bandY=v.bandTop*cell, bandH=(v.bandBot-v.bandTop+1)*cell;
      bgCtx.fillStyle='rgba(225,75,75,0.22)';
      for(let sx=-bandH;sx<bgCanvas.width;sx+=bandH*1.6){
        bgCtx.beginPath();
        bgCtx.moveTo(sx,bandY+bandH); bgCtx.lineTo(sx+bandH,bandY);
        bgCtx.lineTo(sx+bandH*1.3,bandY); bgCtx.lineTo(sx+bandH*0.3,bandY+bandH);
        bgCtx.closePath(); bgCtx.fill();
      }
      bgCtx.restore();
    }
    const px=v.x*cell, py=v.y*cell, r=cell*3.4;
    const grad=bgCtx.createRadialGradient(px-r*0.3,py-r*0.3,r*0.1,px,py,r);
    if(v.open){ grad.addColorStop(0,'#7dfab0'); grad.addColorStop(1,'#0f9a5a'); }
    else { grad.addColorStop(0,'#ff9d9d'); grad.addColorStop(1,'#c02f2f'); }
    bgCtx.beginPath(); bgCtx.arc(px,py,r,0,Math.PI*2); bgCtx.fillStyle=grad; bgCtx.fill();
    bgCtx.lineWidth=3; bgCtx.strokeStyle='#160a3d'; bgCtx.stroke();
    bgCtx.fillStyle='#160a3d'; bgCtx.font='bold '+Math.round(cell*1.8)+'px sans-serif'; bgCtx.textAlign='center';
    bgCtx.fillText(v.open?'ON':'OFF', px, py+cell*0.6);
    bgCtx.textAlign='left';
  });

  bonusPoints.forEach(b=>{
    if(b.collected) return;
    const px=b.x*cell, py=b.y*cell, r=cell*2.2;
    const grad=bgCtx.createRadialGradient(px-r*0.3,py-r*0.3,r*0.1,px,py,r);
    grad.addColorStop(0,'#fff2c4'); grad.addColorStop(1,'#f4b93f');
    bgCtx.beginPath(); bgCtx.arc(px,py,r,0,Math.PI*2); bgCtx.fillStyle=grad; bgCtx.fill();
    bgCtx.lineWidth=2.5; bgCtx.strokeStyle='#7c4dff'; bgCtx.stroke();
    bgCtx.fillStyle='#7c4dff'; bgCtx.font='bold '+Math.round(cell*2.4)+'px sans-serif'; bgCtx.textAlign='center';
    bgCtx.fillText('★', px, py+cell*0.8);
    bgCtx.textAlign='left';
  });

  bgCtx.fillStyle='#160a3d';
  bgCtx.fillRect(sourcePoint.x*cell-16, (sourcePoint.y-3)*cell, 32, cell*3);
}

function drawTub(){
  const {cell}=GAME;
  const tx=tubRect.x*cell, ty=tubRect.y*cell, tw=tubRect.w*cell, th=tubRect.h*cell;
  const ringR = Math.max(tw,th)*0.62;
  const ccx = tx+tw*0.5, ccy = ty+th*0.42;

  // outer tiled ring
  bgCtx.save();
  bgCtx.beginPath(); bgCtx.arc(ccx,ccy,ringR,0,Math.PI*2); bgCtx.fillStyle='#1f6f6a'; bgCtx.fill();
  const tiles=18;
  for(let i=0;i<tiles;i++){
    const a=(i/tiles)*Math.PI*2;
    bgCtx.save(); bgCtx.translate(ccx,ccy); bgCtx.rotate(a);
    bgCtx.fillStyle= i%2===0 ? '#2a8b84':'#20716b';
    bgCtx.fillRect(ringR*0.86,-ringR*0.06,ringR*0.14,ringR*0.12);
    bgCtx.restore();
  }
  bgCtx.restore();

  // inner room
  const innerR = ringR*0.82;
  bgCtx.save();
  bgCtx.beginPath(); bgCtx.arc(ccx,ccy,innerR,0,Math.PI*2); bgCtx.clip();
  const roomGrad = bgCtx.createLinearGradient(ccx,ccy-innerR,ccx,ccy+innerR);
  roomGrad.addColorStop(0,'#f3e3b8'); roomGrad.addColorStop(1,'#e0c98c');
  bgCtx.fillStyle=roomGrad; bgCtx.fillRect(ccx-innerR,ccy-innerR,innerR*2,innerR*2);

  // bathtub shape
  const btW=innerR*1.3, btH=innerR*0.62, btX=ccx-btW*0.42, btY=ccy+innerR*0.12;
  bgCtx.fillStyle='#f5f2e6';
  bgCtx.beginPath(); bgCtx.roundRect(btX,btY,btW,btH,btH*0.5); bgCtx.fill();
  bgCtx.strokeStyle='#c9bfa0'; bgCtx.lineWidth=2; bgCtx.stroke();

  // water level inside tub — con oleaje animado
  const pct = Math.min(1, collected/(cfg.drops*cfg.winPct));
  const fillH = btH*0.7*pct;
  const waveTop = btY+btH-fillH;
  bgCtx.save();
  bgCtx.beginPath(); bgCtx.roundRect(btX+4,btY+4,btW-8,btH-8,btH*0.45); bgCtx.clip();
  const wg=bgCtx.createLinearGradient(0,waveTop,0,btY+btH);
  wg.addColorStop(0,'#5fd3f2'); wg.addColorStop(1,'#0f7fb0');
  bgCtx.fillStyle=wg;
  bgCtx.beginPath();
  bgCtx.moveTo(btX, btY+btH+8);
  bgCtx.lineTo(btX, waveTop);
  const wavePhase = animT*0.14;
  for(let wx=0; wx<=btW; wx+=btW/24){
    const wy = waveTop + Math.sin(wavePhase + wx*0.09)*(pct>0.02?2.2:0);
    bgCtx.lineTo(btX+wx, wy);
  }
  bgCtx.lineTo(btX+btW, btY+btH+8);
  bgCtx.closePath(); bgCtx.fill();
  bgCtx.restore();

  // shower head
  bgCtx.strokeStyle='#8a97a8'; bgCtx.lineWidth=4;
  bgCtx.beginPath(); bgCtx.moveTo(ccx+innerR*0.55, ccy-innerR*0.75); bgCtx.lineTo(ccx+innerR*0.55, ccy-innerR*0.35); bgCtx.stroke();
  bgCtx.fillStyle='#8a97a8';
  bgCtx.beginPath(); bgCtx.ellipse(ccx+innerR*0.55, ccy-innerR*0.78, 16,7,0,0,Math.PI*2); bgCtx.fill();

  // character (Rodmy) in tub — respira y reacciona al nivel de agua
  const bob = Math.sin(animT*0.09)*1.1;
  const charX = btX+btW*0.42, charY = btY+btH*0.35 + bob, s=innerR*0.028;
  const joy = Math.min(1, pct*1.4); // 0=serio, 1=feliz
  bgCtx.fillStyle='#c98a55';
  bgCtx.beginPath(); bgCtx.arc(charX, charY-8*s, 7*s, 0, Math.PI*2); bgCtx.fill();
  bgCtx.fillStyle='#160a3d';
  bgCtx.fillRect(charX-5.5*s, charY-9.5*s, 11*s, 3*s);
  // sonrisa que crece con el nivel de agua
  bgCtx.strokeStyle='#5a3018'; bgCtx.lineWidth=1.4*s; bgCtx.lineCap='round';
  bgCtx.beginPath();
  bgCtx.arc(charX, charY-4*s, (1.6+joy*1.6)*s, 0.15*Math.PI, 0.85*Math.PI);
  bgCtx.stroke();
  bgCtx.fillStyle='#3a1e8c';
  bgCtx.beginPath(); bgCtx.ellipse(charX, charY+2*s, 9*s, 6*s, 0, 0, Math.PI*2); bgCtx.fill();
  // brazos: se levantan cuando la tina se llena, como festejando
  const armLift = joy*6*s;
  bgCtx.fillStyle='#c98a55';
  bgCtx.beginPath(); bgCtx.arc(charX-10*s, charY-1*s-armLift, 2.6*s,0,Math.PI*2); bgCtx.fill();
  bgCtx.beginPath(); bgCtx.arc(charX+10*s, charY-1*s-armLift, 2.6*s,0,Math.PI*2); bgCtx.fill();

  if(pct>0.03){
    bgCtx.fillStyle='rgba(255,255,255,0.65)';
    for(let i=0;i<5;i++){
      const rise=(animT*0.9+i*17)%38;
      const bx=charX-18*s+i*8*s, by=(btY+btH-2)-rise*s*0.9;
      if(by<waveTop) continue;
      bgCtx.beginPath(); bgCtx.arc(bx, by, (1.6+i%2)*s,0,Math.PI*2); bgCtx.fill();
    }
  }
  bgCtx.restore();

  bgCtx.strokeStyle='#0d4340'; bgCtx.lineWidth=6;
  bgCtx.beginPath(); bgCtx.arc(ccx,ccy,ringR,0,Math.PI*2); bgCtx.stroke();

  bgCtx.fillStyle='#f4b93f'; bgCtx.font='bold 12px sans-serif'; bgCtx.textAlign='center';
  bgCtx.fillText('RODMY', ccx, ty-8);
  bgCtx.textAlign='left';
}

function simulateWater(){
  const {cols,rows}=GAME;
  const idx=(x,y)=>y*cols+x;
  waterCells.sort((a,b)=>b.y-a.y);
  const next=[];
  for(const w of waterCells){
    let grabbed=false;
    for(const b of bonusPoints){
      if(!b.collected && Math.hypot(b.x-w.x,b.y-w.y)<2.4){
        b.collected=true; bonusCollected++; grabbed=true;
        for(let i=0;i<7;i++){
          const a=(i/7)*Math.PI*2;
          splashParticles.push({x:b.x,y:b.y,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6-0.6,life:1,color:'#f4b93f',star:true});
        }
        break;
      }
    }
    if(grabbed) continue;
    let x=Math.floor(w.x), y=Math.floor(w.y);
    const below = (y+1<rows) ? grid[idx(x,y+1)] : TILE.DRAIN;
    if(below===TILE.TUB){
      collected++;
      for(let i=0;i<3;i++) splashParticles.push({x:w.x,y:w.y,vx:(Math.random()-0.5)*1.8,vy:-(Math.random()*1.3+0.4),life:1,color:'#bff0ff'});
      continue;
    }
    if(below===TILE.DRAIN || y+1>=rows){ lost++; continue; }
    if(below===TILE.AIR){ w.y+=1; next.push(w); continue; }
    const dir=Math.random()<0.5?-1:1; let moved=false;
    for(const d of [dir,-dir]){
      const nx=x+d; if(nx<0||nx>=cols) continue;
      const t=grid[idx(nx,y+1)];
      if(t===TILE.TUB){
        collected++; moved=true;
        for(let i=0;i<3;i++) splashParticles.push({x:w.x,y:w.y,vx:(Math.random()-0.5)*1.8,vy:-(Math.random()*1.3+0.4),life:1,color:'#bff0ff'});
        break;
      }
      if(t===TILE.AIR||t===TILE.DRAIN){
        w.x=nx;
        if(t===TILE.DRAIN){ lost++; moved=true; break; }
        w.y=y+1; next.push(w); moved=true; break;
      }
    }
    if(moved) continue;
    const sdir=Math.random()<0.5?-1:1;
    for(const d of [sdir,-sdir]){
      const nx=x+d; if(nx<0||nx>=cols) continue;
      if(grid[idx(nx,y)]===TILE.AIR){ w.x=nx; next.push(w); moved=true; break; }
    }
    if(!moved) next.push(w);
  }
  waterCells=next;
}

function drawWater(){
  const {cell}=GAME;
  waterCtx.clearRect(0,0,waterCanvas.width,waterCanvas.height);
  waterCtx.fillStyle='#33b8e6';
  for(const w of waterCells){
    waterCtx.beginPath();
    waterCtx.arc(w.x*cell+cell/2, w.y*cell+cell/2, cell*1.5, 0, Math.PI*2);
    waterCtx.fill();
  }
  splashParticles.forEach(p=>{ p.x+=p.vx*0.35; p.y+=p.vy*0.35; p.vy+=0.1; p.life-=0.045; });
  splashParticles = splashParticles.filter(p=>p.life>0);
  splashParticles.forEach(p=>{
    waterCtx.globalAlpha=Math.max(0,p.life);
    waterCtx.fillStyle=p.color||'#bff0ff';
    waterCtx.beginPath();
    waterCtx.arc(p.x*cell+cell/2, p.y*cell+cell/2, cell*(p.star?1.3:0.9), 0, Math.PI*2);
    waterCtx.fill();
  });
  waterCtx.globalAlpha=1;
}

function gameLoop(ts){
  if(!loopRunning) return;
  if(ts-lastFrame>45){
    animT++;
    simulateWater();
    drawWater();
    if(document.getElementById('hud-pct')) drawTub();
    const pct=Math.min(100, Math.round((collected/(cfg.drops*cfg.winPct))*100));
    const pctEl=document.getElementById('hud-pct'); if(pctEl) pctEl.textContent=pct+'%';
    const lostEl=document.getElementById('hud-lost'); if(lostEl) lostEl.textContent=lost;
    const bonusEl=document.getElementById('hud-bonus'); if(bonusEl) bonusEl.textContent=bonusCollected+'/'+((cfg.bonus||[]).length);
    lastFrame=ts;
    if(spawned>=cfg.drops && waterCells.length===0){
      loopRunning=false; clearInterval(tickTimer); clearInterval(spawnTimer); endLevel(); return;
    }
  }
  requestAnimationFrame(gameLoop);
}

function endLevel(){
  loopRunning=false;
  const pct=Math.min(100, Math.round((collected/(cfg.drops*cfg.winPct))*100));
  const win = collected >= cfg.drops*cfg.winPct;
  const ecoPoints = (win ? Math.round(15+(pct-Math.round(cfg.winPct*100))*0.5) : Math.round(pct*0.15)) + bonusCollected*8;
  const score = collected*450 + Math.max(0,timeLeft)*20 + bonusCollected*600;
  const isLast = currentLevel===LEVELS.length-1;
  if(win && currentLevel+1>unlocked-1+1) unlocked = Math.max(unlocked, currentLevel+2);
  if(win) unlocked = Math.max(unlocked, Math.min(LEVELS.length, currentLevel+2));

  const confettiColors=['#f4b93f','#7c4dff','#33b8e6','#7dfab0','#e14b4b'];
  const confettiHTML = win ? Array.from({length:20}).map(()=>{
    const left=(Math.random()*100).toFixed(1);
    const color=confettiColors[Math.floor(Math.random()*confettiColors.length)];
    const delay=(Math.random()*0.5).toFixed(2);
    const dur=(1.5+Math.random()*1).toFixed(2);
    return `<div class="confetti" style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${dur}s;"></div>`;
  }).join('') : '';

  stage.innerHTML = `
    <div class="brand"><div class="dot"></div><div>
      <div class="brand-text">MensIn<span>Black</span></div>
      <div class="brand-sub">Nivel ${currentLevel+1} &middot; ${cfg.name}</div></div></div>
    <div class="end-panel ${win?'':'fail'}">
      ${confettiHTML}
      <div class="badge ${win?'':'fail'}">${win?'🛁':'⚠'}</div>
      <div class="victory-title">${win?(isLast?'MISI\u00d3N COMPLETA':'VICTORIA DE NIVEL'):'AGUA PERDIDA'}</div>
      <div style="font-size:12px;color:#c6b8f0;margin-top:6px;">${win?'Rodmy pudo ba\u00f1arse con el agua a tiempo.':'La tina no se llen\u00f3 lo suficiente antes del tiempo.'}</div>
      <div class="meter-bar"><div class="meter-fill" style="width:${pct}%"></div></div>
      <div class="score-row"><span>Tina llena</span><b>${pct}%</b></div>
      <div class="score-row"><span>Gotas bonus</span><b>${bonusCollected}/${(cfg.bonus||[]).length} ★</b></div>
      <div class="score-row"><span>Score</span><b>${score.toLocaleString()}</b></div>
      <div class="score-row"><span>Tiempo restante</span><b>${Math.max(0,timeLeft)}s</b></div>
      <div class="eco-line">${win?'+':''}${ecoPoints} Eco-Puntos ${win?'&middot; Certified Eco-Agent 🏅':''}</div>
      ${win && !isLast ? `<button class="btn" onclick="launchLevel(${currentLevel+1})">▶ SIGUIENTE NIVEL</button>` : `<button class="btn" onclick="launchLevel(${currentLevel})">↻ REINTENTAR NIVEL</button>`}
      <button class="btn secondary" style="margin-top:10px;" onclick="renderStart()">◀ MEN&Uacute;</button>
    </div>
    <div class="footer-credit">MensInBlack La Paz &middot; Prototipo de Gameplay</div>`;
}

renderStart();
</script>
